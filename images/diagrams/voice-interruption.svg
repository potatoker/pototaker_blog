<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">打断不是只按一下暂停</title><desc id="desc">让会话状态与用户实际听到的内容保持一致</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7b8584"/></marker></defs><style>text{font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#202725}.title{font-size:30px;font-weight:600;letter-spacing:-1px}.sub{font-size:18px;fill:#707977}.label{font-size:23px;font-weight:500}.body{font-size:18px;fill:#606966}.mono{font:16px ui-monospace,Menlo,monospace;fill:#7b8580}.accent{fill:#335c50}.edge{fill:none;stroke:#7b8584;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 6}</style><rect width="720" height="520" rx="8" fill="#f4f5f3"/>
<text x="40" y="59" class="title">打断不是只按一下暂停</text>
<text x="40" y="93" class="sub">让会话状态与用户实际听到的内容保持一致</text>
<rect x="48" y="142" width="284" height="104" rx="8" fill="#fff" stroke="#d6dbd6" stroke-width="1.5"/>
<text x="70" y="178" class="label">正在说话</text>
<text x="70" y="208" class="body">文字生成 → 合成 → 播放</text>
<rect x="388" y="142" width="284" height="104" rx="8" fill="#e8eeea" stroke="#77978b" stroke-width="1.5"/>
<text x="410" y="178" class="label">用户开始说话</text>
<text x="410" y="208" class="body">检测到新一轮输入</text>
<path d="M332 194 H377" class="edge"/>
<path d="M530 247 V285 H360 V315" class="edge"/>
<rect x="48" y="328" width="624" height="111" rx="8" fill="#e8eeea" stroke="#77978b" stroke-width="1.5"/>
<text x="70" y="364" class="label">一起更新状态</text>
<text x="70" y="394" class="body">取消旧生成 · 丢弃未播放音频</text>
<text x="70" y="419" class="body">记录已说出的部分 → 进入新一轮倾听</text>
<text x="48" y="486" class="body">避免声音停了，对话上下文却仍假定“整段已说完”。</text>
</svg>
