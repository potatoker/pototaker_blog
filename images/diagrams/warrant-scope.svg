<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">局部同步，也要带上依赖</title><desc id="desc">只验收选中的范围，不把部分通过写成整版通过</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7b8584"/></marker></defs><style>text{font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#202725}.title{font-size:30px;font-weight:600;letter-spacing:-1px}.sub{font-size:18px;fill:#707977}.label{font-size:23px;font-weight:500}.body{font-size:18px;fill:#606966}.mono{font:16px ui-monospace,Menlo,monospace;fill:#7b8580}.accent{fill:#335c50}.edge{fill:none;stroke:#7b8584;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 6}</style><rect width="720" height="650" rx="8" fill="#f4f5f3"/>
<text x="40" y="59" class="title">局部同步，也要带上依赖</text>
<text x="40" y="93" class="sub">只验收选中的范围，不把部分通过写成整版通过</text>
<rect x="192" y="132" width="336" height="107" rx="8" fill="#e8eeea" stroke="#77978b" stroke-width="1.5"/>
<text x="214" y="168" class="label">共享规则 / 内容资产</text>
<text x="214" y="198" class="body">被两个功能单元依赖</text>
<path d="M360 239 V276 H192 V310" class="edge"/>
<path d="M360 276 H528 V310" class="edge dashed"/>
<rect x="48" y="320" width="288" height="105" rx="8" fill="#e8eeea" stroke="#77978b" stroke-width="1.5"/>
<text x="70" y="356" class="label">功能单元 B</text>
<text x="70" y="386" class="body">本次选择同步的范围</text>
<rect x="384" y="320" width="288" height="105" rx="8" fill="#fff" stroke="#d6dbd6" stroke-width="1.5"/>
<text x="406" y="356" class="label">功能单元 C</text>
<text x="406" y="386" class="body">本次未同步的范围</text>
<path d="M192 426 V469" class="edge"/>
<path d="M528 426 V469" class="edge dashed"/>
<rect x="48" y="482" width="288" height="92" rx="8" fill="#e8eeea" stroke="#77978b" stroke-width="1.5"/>
<text x="70" y="518" class="label">B 的运行用例</text>
<text x="70" y="548" class="body">为选中范围提供证据</text>
<rect x="384" y="482" width="288" height="92" rx="8" fill="#fff" stroke="#d6dbd6" stroke-width="1.5"/>
<text x="406" y="518" class="label">C 的运行用例</text>
<text x="406" y="548" class="body">不能默认视为已通过</text>
<text x="48" y="617" class="body">验收记录 = 选中单元 + 依赖闭包 + 对应证据</text>
</svg>
