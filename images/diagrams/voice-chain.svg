<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">语音交互是一条完整链路</title><desc id="desc">模型之外，还要协调采集、队列、取消与播放</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7b8584"/></marker></defs><style>text{font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#202725}.title{font-size:30px;font-weight:600;letter-spacing:-1px}.sub{font-size:18px;fill:#707977}.label{font-size:23px;font-weight:500}.body{font-size:18px;fill:#606966}.mono{font:16px ui-monospace,Menlo,monospace;fill:#7b8580}.accent{fill:#335c50}.edge{fill:none;stroke:#7b8584;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 6}</style><rect width="720" height="650" rx="8" fill="#f4f5f3"/>
<text x="40" y="59" class="title">语音交互是一条完整链路</text>
<text x="40" y="93" class="sub">模型之外，还要协调采集、队列、取消与播放</text>
<rect x="48" y="139" width="624" height="104" rx="8" fill="#fff" stroke="#d6dbd6" stroke-width="1.5"/>
<text x="70" y="175" class="label">采集与识别</text>
<text x="70" y="205" class="body">麦克风 → 端点判断 → 文字 / 语音表示</text>
<path d="M360 244 V273" class="edge"/>
<rect x="48" y="281" width="624" height="104" rx="8" fill="#e8eeea" stroke="#77978b" stroke-width="1.5"/>
<text x="70" y="317" class="label">生成回复</text>
<text x="70" y="347" class="body">理解上下文，决定回答或调用工具</text>
<path d="M360 386 V415" class="edge"/>
<rect x="48" y="423" width="624" height="104" rx="8" fill="#fff" stroke="#d6dbd6" stroke-width="1.5"/>
<text x="70" y="459" class="label">合成与播放</text>
<text x="70" y="489" class="body">流式生成声音，并管理尚未播放的片段</text>
<text x="48" y="607" class="label">一次打断，需要同时处理生成请求与播放队列。</text>
</svg>
