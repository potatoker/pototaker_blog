<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc"><title id="title">从原型到可验收交付</title><desc id="desc">把行为、版本和证据连在同一条链路上</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7b8584"/></marker></defs><style>text{font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#202725}.title{font-size:30px;font-weight:600;letter-spacing:-1px}.sub{font-size:18px;fill:#707977}.label{font-size:23px;font-weight:500}.body{font-size:18px;fill:#606966}.mono{font:16px ui-monospace,Menlo,monospace;fill:#7b8580}.accent{fill:#335c50}.edge{fill:none;stroke:#7b8584;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 6}</style><rect width="720" height="760" rx="8" fill="#f4f5f3"/>
<text x="40" y="59" class="title">从原型到可验收交付</text>
<text x="40" y="93" class="sub">把行为、版本和证据连在同一条链路上</text>
<rect x="48" y="132" width="624" height="117" rx="8" fill="#fff" stroke="#d6dbd6" stroke-width="1.5"/>
<text x="70" y="168" class="label">01  整理原型</text>
<text x="70" y="198" class="body">入口 · 输入输出 · 条件分支</text>
<text x="70" y="223" class="body">说明需要保留的行为与关键取舍</text>
<path d="M360 250 V272" class="edge"/>
<rect x="48" y="279" width="624" height="117" rx="8" fill="#fff" stroke="#d6dbd6" stroke-width="1.5"/>
<text x="70" y="315" class="label">02  固定交付快照</text>
<text x="70" y="345" class="body">精确代码版本 + 内容资产 + 用例</text>
<text x="70" y="370" class="body">以内容指纹标记这一次交付</text>
<path d="M360 397 V419" class="edge"/>
<rect x="48" y="426" width="624" height="117" rx="8" fill="#fff" stroke="#d6dbd6" stroke-width="1.5"/>
<text x="70" y="462" class="label">03  实现与运行</text>
<text x="70" y="492" class="body">对照约定实现，实际执行对应测试</text>
<text x="70" y="517" class="body">记录输入、输出、版本与运行结果</text>
<path d="M360 544 V566" class="edge"/>
<rect x="48" y="573" width="624" height="117" rx="8" fill="#e8eeea" stroke="#77978b" stroke-width="1.5"/>
<text x="70" y="609" class="label">04  明确验收范围</text>
<text x="70" y="639" class="body">哪些路径已通过？哪些证据仍缺失？</text>
<text x="70" y="664" class="body">结论对应具体对象与具体版本</text>
</svg>
