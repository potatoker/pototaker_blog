<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-labelledby="title desc"><title id="title">拆开一个数字人演示</title><desc id="desc">把各层能力分别验证，再看它们怎样协作</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#7b8584"/></marker></defs><style>text{font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#202725}.title{font-size:30px;font-weight:600;letter-spacing:-1px}.sub{font-size:18px;fill:#707977}.label{font-size:23px;font-weight:500}.body{font-size:18px;fill:#606966}.mono{font:16px ui-monospace,Menlo,monospace;fill:#7b8580}.accent{fill:#335c50}.edge{fill:none;stroke:#7b8584;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 6}</style><rect width="720" height="680" rx="8" fill="#f4f5f3"/>
