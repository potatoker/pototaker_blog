<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">从产品意图到运行实现的三种开发链路</title>
  <desc id="desc">传统开发通过需求文档、技术方案、源代码、编译和发布逐层收敛意图；SDD 保留这条链并让 AI 承担实现；Vibe Coding 将中间环节压缩成效果反馈闭环，并在原型发版到线上时需要新的 production artifact。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F9F5FF"/>
    </linearGradient>
    <linearGradient id="artifact" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5B8FF9"/>
      <stop offset="1" stop-color="#7A5AF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#344054" flood-opacity=".09"/>
    </filter>
    <style>
      .cn{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:42px;font-weight:700;fill:#101828}
      .sub{font-size:21px;fill:#667085}
      .lane{font-size:18px;font-weight:700}
      .head{font-size:18px;font-weight:700;fill:#101828}
      .small{font-size:15px;fill:#667085}
      .note{font-size:16px;font-weight:700}
    </style>
  </defs>

  <rect width="1400" height="900" rx="32" fill="url(#bg)"/>
  <text class="cn title" x="72" y="78">AI 没有只替换一个角色，它改变了意图抵达实现的路径</text>
  <text class="cn sub" x="72" y="118">传统链路、SDD 与真实 Vibe Coding，分别把什么留作下一步的可信输入？</text>

  <rect x="54" y="161" width="1292" height="168" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="78" y="184" width="112" height="34" rx="17" fill="#F2F4F7"/>
  <text class="cn lane" x="134" y="207" text-anchor="middle" fill="#344054">传统开发</text>

  <g>
    <rect x="218" y="205" width="130" height="70" rx="18" fill="#F2F4F7"/>
    <text class="cn head" x="283" y="246" text-anchor="middle">产品意图</text>

    <rect x="378" y="205" width="130" height="70" rx="18" fill="#EEF4FF"/>
    <text class="cn head" x="443" y="235" text-anchor="middle">PRD /</text>
    <text class="cn head" x="443" y="258" text-anchor="middle">需求文档</text>

    <rect x="538" y="205" width="130" height="70" rx="18" fill="#EEF4FF"/>
    <text class="cn head" x="603" y="235" text-anchor="middle">技术方案</text>
    <text class="cn head" x="603" y="258" text-anchor="middle">文档</text>

    <rect x="698" y="193" width="130" height="94" rx="20" fill="#ECFDF3" stroke="#6CE9A6" stroke-width="2"/>
    <text class="cn small" x="763" y="217" text-anchor="middle" fill="#027A48">SOURCE</text>
    <text class="cn head" x="763" y="254" text-anchor="middle">源代码</text>

    <rect x="858" y="205" width="130" height="70" rx="18" fill="#F2F4F7"/>
    <text class="cn head" x="923" y="235" text-anchor="middle">编译器 /</text>
    <text class="cn head" x="923" y="258" text-anchor="middle">中间码</text>

    <rect x="1018" y="205" width="130" height="70" rx="18" fill="#F2F4F7"/>
    <text class="cn head" x="1083" y="235" text-anchor="middle">二进制</text>
    <text class="cn head" x="1083" y="258" text-anchor="middle">发布包</text>

    <rect x="1178" y="205" width="130" height="70" rx="18" fill="#ECFDF3" stroke="#6CE9A6" stroke-width="2"/>
    <text class="cn head" x="1243" y="235" text-anchor="middle" fill="#027A48">运行</text>
    <text class="cn head" x="1243" y="258" text-anchor="middle" fill="#027A48">实现</text>
  </g>

  <g fill="none" stroke="#98A2B3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M352 240H370"/><path d="M362 232L371 240L362 248"/>
    <path d="M512 240H530"/><path d="M522 232L531 240L522 248"/>
    <path d="M672 240H690"/><path d="M682 232L691 240L682 248"/>
    <path d="M832 240H850"/><path d="M842 232L851 240L842 248"/>
    <path d="M992 240H1010"/><path d="M1002 232L1011 240L1002 248"/>
    <path d="M1152 240H1170"/><path d="M1162 232L1171 240L1162 248"/>
  </g>
  <text class="cn small" x="510" y="308" text-anchor="middle">开放判断 + 角色交接：每一棒都有必须消费的工件</text>
  <text class="cn small" x="1060" y="308" text-anchor="middle" fill="#027A48">源码之后：转换逐渐接近确定性</text>

  <rect x="54" y="352" width="1292" height="168" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="78" y="375" width="112" height="34" rx="17" fill="#F4F0FF"/>
  <text class="cn lane" x="134" y="398" text-anchor="middle" fill="#6941C6">SDD</text>

  <g>
    <rect x="218" y="396" width="130" height="70" rx="18" fill="#F2F4F7"/>
    <text class="cn head" x="283" y="437" text-anchor="middle">产品意图</text>

    <rect x="378" y="384" width="130" height="94" rx="20" fill="#F4F0FF" stroke="#B9A7F8" stroke-width="2"/>
    <text class="cn small" x="443" y="408" text-anchor="middle" fill="#6941C6">PRIMARY</text>
    <text class="cn head" x="443" y="445" text-anchor="middle">Spec</text>

    <rect x="538" y="396" width="130" height="70" rx="18" fill="#F4F0FF"/>
    <text class="cn head" x="603" y="426" text-anchor="middle">Plan /</text>
    <text class="cn head" x="603" y="449" text-anchor="middle">Tasks</text>

    <rect x="698" y="396" width="130" height="70" rx="18" fill="#F4F0FF"/>
    <text class="cn head" x="763" y="426" text-anchor="middle">AI</text>
    <text class="cn head" x="763" y="449" text-anchor="middle">Agent</text>

    <rect x="858" y="396" width="130" height="70" rx="18" fill="#EEF4FF"/>
    <text class="cn head" x="923" y="437" text-anchor="middle">源代码</text>

    <rect x="1018" y="396" width="130" height="70" rx="18" fill="#F2F4F7"/>
    <text class="cn head" x="1083" y="437" text-anchor="middle">Build</text>

    <rect x="1178" y="396" width="130" height="70" rx="18" fill="#ECFDF3" stroke="#6CE9A6" stroke-width="2"/>
    <text class="cn head" x="1243" y="426" text-anchor="middle" fill="#027A48">运行</text>
    <text class="cn head" x="1243" y="449" text-anchor="middle" fill="#027A48">实现</text>
  </g>

  <g fill="none" stroke="#9E77ED" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M352 431H370"/><path d="M362 423L371 431L362 439"/>
    <path d="M512 431H530"/><path d="M522 423L531 431L522 439"/>
    <path d="M672 431H690"/><path d="M682 423L691 431L682 439"/>
    <path d="M832 431H850"/><path d="M842 423L851 431L842 439"/>
    <path d="M992 431H1010"/><path d="M1002 423L1011 431L1002 439"/>
    <path d="M1152 431H1170"/><path d="M1162 423L1171 431L1162 439"/>
  </g>
  <text class="cn small" x="763" y="499" text-anchor="middle" fill="#6941C6">原链路仍然成立：Spec 进入主流程，AI 承担越来越多实现工作</text>

  <rect x="54" y="543" width="1292" height="224" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="78" y="566" width="112" height="34" rx="17" fill="#FFF7ED"/>
  <text class="cn lane" x="134" y="589" text-anchor="middle" fill="#B54708">Vibe → Prod</text>

  <g>
    <rect x="218" y="600" width="130" height="70" rx="18" fill="#FFF7ED"/>
    <text class="cn head" x="283" y="630" text-anchor="middle">想法 /</text>
    <text class="cn head" x="283" y="653" text-anchor="middle">体验目标</text>

    <rect x="378" y="600" width="130" height="70" rx="18" fill="#FFF7ED"/>
    <text class="cn head" x="443" y="630" text-anchor="middle">人 ↔ AI</text>
    <text class="cn head" x="443" y="653" text-anchor="middle">反复尝试</text>

    <rect x="538" y="600" width="130" height="70" rx="18" fill="#EEF4FF"/>
    <text class="cn head" x="603" y="630" text-anchor="middle">原型</text>
    <text class="cn head" x="603" y="653" text-anchor="middle">代码</text>

    <rect x="698" y="600" width="130" height="70" rx="18" fill="#ECFDF3"/>
    <text class="cn head" x="763" y="630" text-anchor="middle">效果</text>
    <text class="cn head" x="763" y="653" text-anchor="middle">验收</text>

    <rect x="858" y="588" width="130" height="94" rx="20" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
    <text class="cn small" x="923" y="612" text-anchor="middle" fill="#B54708">BOUNDARY</text>
    <text class="cn head" x="923" y="649" text-anchor="middle" fill="#B54708">发版</text>

    <rect x="1018" y="588" width="130" height="94" rx="20" fill="url(#artifact)"/>
    <text class="cn small" x="1083" y="612" text-anchor="middle" fill="#E9D7FE">NEW SOURCE?</text>
    <text class="cn head" x="1083" y="640" text-anchor="middle" fill="#FFFFFF">Production</text>
    <text class="cn head" x="1083" y="662" text-anchor="middle" fill="#FFFFFF">artifact</text>

    <rect x="1178" y="600" width="130" height="70" rx="18" fill="#ECFDF3" stroke="#6CE9A6" stroke-width="2"/>
    <text class="cn head" x="1243" y="630" text-anchor="middle" fill="#027A48">线上</text>
    <text class="cn head" x="1243" y="653" text-anchor="middle" fill="#027A48">实现</text>
  </g>

  <g fill="none" stroke="#F79009" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M352 635H370"/><path d="M362 627L371 635L362 643"/>
    <path d="M512 635H530"/><path d="M522 627L531 635L522 643"/>
    <path d="M672 635H690"/><path d="M682 627L691 635L682 643"/>
    <path d="M832 635H850"/><path d="M842 627L851 635L842 643"/>
    <path d="M992 635H1010"/><path d="M1002 627L1011 635L1002 643"/>
    <path d="M1152 635H1170"/><path d="M1162 627L1171 635L1162 643"/>
  </g>

  <rect x="278" y="703" width="844" height="42" rx="21" fill="#F4F0FF"/>
  <text class="cn note" x="700" y="730" text-anchor="middle" fill="#6941C6">Production artifact = 规约 + 参考实现 + 验收证据 + 版本身份</text>

  <rect x="166" y="810" width="1068" height="58" rx="29" fill="#EEF4FF" stroke="#84ADFF" stroke-width="2"/>
  <text class="cn" x="700" y="846" text-anchor="middle" font-size="20" font-weight="700" fill="#175CD3">关键问题：Prompt 只是一次指令；哪组输入才足以重现行为，并判断还原成功？</text>
</svg>
