<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">AI 时代的最小可重现单位</title>
  <desc id="desc">传统开发中源码位于开放判断结束和确定性构建开始之间；AI 开发中一句 prompt 无法重放模型补足的判断，因此需要由可执行规约、参考实现、验收 oracle 和环境版本组成最小可重现闭包。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F9F5FF"/>
    </linearGradient>
    <linearGradient id="closure" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EEF4FF"/>
      <stop offset="1" stop-color="#F4F0FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#344054" flood-opacity=".1"/>
    </filter>
    <style>
      .cn{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:43px;font-weight:700;fill:#101828}
      .sub{font-size:22px;fill:#667085}
      .lane{font-size:19px;font-weight:700;fill:#344054}
      .head{font-size:20px;font-weight:700;fill:#101828}
      .body{font-size:17px;fill:#667085}
      .small{font-size:15px;fill:#667085}
    </style>
  </defs>

  <rect width="1400" height="788" rx="32" fill="url(#bg)"/>
  <text class="cn title" x="72" y="81">“源码”不是一种文件，而是一条可重现边界</text>
  <text class="cn sub" x="72" y="122">关键不是保存了什么，而是这些输入能否重建目标，并判断重建是否成功</text>

  <rect x="62" y="177" width="1276" height="188" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="88" y="201" width="112" height="34" rx="17" fill="#F2F4F7"/>
  <text class="cn lane" x="144" y="225" text-anchor="middle">传统开发</text>

  <rect x="108" y="261" width="192" height="70" rx="20" fill="#F2F4F7"/>
  <text class="cn head" x="204" y="291" text-anchor="middle">需求 / 技术方案</text>
  <text class="cn small" x="204" y="317" text-anchor="middle">不足以重现同一份代码</text>

  <path d="M314 296H388" fill="none" stroke="#98A2B3" stroke-width="5" stroke-linecap="round"/>
  <path d="M373 282L389 296L373 310" fill="none" stroke="#98A2B3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="cn small" x="352" y="275" text-anchor="middle">人补足判断</text>

  <rect x="404" y="249" width="318" height="94" rx="22" fill="#ECFDF3" stroke="#6CE9A6" stroke-width="2"/>
  <text class="cn head" x="563" y="286" text-anchor="middle">源码 + 依赖 + 工具链</text>
  <text class="cn body" x="563" y="317" text-anchor="middle">稳定的可重现边界</text>

  <path d="M738 296H812" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round"/>
  <path d="M797 282L813 296L797 310" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="cn small" x="775" y="275" text-anchor="middle" fill="#027A48">确定性构建</text>

  <rect x="828" y="261" width="196" height="70" rx="20" fill="#F2F4F7"/>
  <text class="cn head" x="926" y="291" text-anchor="middle">二进制</text>
  <text class="cn small" x="926" y="317" text-anchor="middle">构建产物</text>

  <path d="M1038 296H1112" fill="none" stroke="#98A2B3" stroke-width="5" stroke-linecap="round"/>
  <path d="M1097 282L1113 296L1097 310" fill="none" stroke="#98A2B3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1128" y="261" width="180" height="70" rx="20" fill="#101828"/>
  <text class="cn head" x="1218" y="291" text-anchor="middle" fill="#FFFFFF">运行产物</text>
  <text class="cn small" x="1218" y="317" text-anchor="middle" fill="#D0D5DD">可以被重现</text>

  <rect x="62" y="401" width="1276" height="318" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="88" y="425" width="112" height="34" rx="17" fill="#F4F0FF"/>
  <text class="cn lane" x="144" y="449" text-anchor="middle" fill="#6941C6">AI 开发</text>

  <rect x="108" y="491" width="192" height="76" rx="20" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <text class="cn head" x="204" y="522" text-anchor="middle">一句 prompt</text>
  <text class="cn small" x="204" y="550" text-anchor="middle" fill="#B54708">不是充分输入</text>

  <path d="M314 529H388" fill="none" stroke="#F79009" stroke-width="5" stroke-linecap="round"/>
  <path d="M373 515L389 529L373 543" fill="none" stroke="#F79009" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="404" y="479" width="318" height="100" rx="22" fill="#F4F0FF" stroke="#B9A7F8" stroke-width="2"/>
  <text class="cn head" x="563" y="516" text-anchor="middle">模型 + 上下文 + 仓库 + 工具</text>
  <text class="cn body" x="563" y="548" text-anchor="middle">AI 补足大量开放判断</text>

  <path d="M738 529H812" fill="none" stroke="#7A5AF8" stroke-width="5" stroke-linecap="round"/>
  <path d="M797 515L813 529L797 543" fill="none" stroke="#7A5AF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="828" y="491" width="196" height="76" rx="20" fill="#EEF4FF"/>
  <text class="cn head" x="926" y="522" text-anchor="middle">生成代码</text>
  <text class="cn small" x="926" y="550" text-anchor="middle">当前参考实现</text>

  <path d="M1038 529H1112" fill="none" stroke="#98A2B3" stroke-width="5" stroke-linecap="round"/>
  <path d="M1097 515L1113 529L1097 543" fill="none" stroke="#98A2B3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1128" y="491" width="180" height="76" rx="20" fill="#101828"/>
  <text class="cn head" x="1218" y="522" text-anchor="middle" fill="#FFFFFF">被验收的效果</text>
  <text class="cn small" x="1218" y="550" text-anchor="middle" fill="#D0D5DD">真正留下的目标</text>

  <rect x="202" y="616" width="996" height="72" rx="24" fill="url(#closure)" stroke="#9E77ED" stroke-width="2"/>
  <text class="cn head" x="230" y="646">最小可重现闭包</text>
  <text class="cn body" x="230" y="674">可执行规约</text>
  <circle cx="381" cy="668" r="4" fill="#7A5AF8"/>
  <text class="cn body" x="401" y="674">参考实现</text>
  <circle cx="531" cy="668" r="4" fill="#7A5AF8"/>
  <text class="cn body" x="551" y="674">验收 oracle</text>
  <circle cx="711" cy="668" r="4" fill="#7A5AF8"/>
  <text class="cn body" x="731" y="674">环境与版本</text>
  <text class="cn body" x="1005" y="657" text-anchor="middle" fill="#6941C6">既能重建</text>
  <text class="cn body" x="1005" y="681" text-anchor="middle" fill="#6941C6">也能判定正确</text>
</svg>
