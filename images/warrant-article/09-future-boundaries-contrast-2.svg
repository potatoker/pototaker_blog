<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">交付物跟着责任与验证边界移动</title>
  <desc id="desc">软件开发从传统的产品与开发角色交接，移动到同一团队拥有完整价值流并通过流水线验收变化，未来可能进一步移动到 Agent 变化与真实用户之间；相应交付物从文档和代码，变为发布状态与持续证据，最终可能演化为带证据的变化。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F9F5FF"/>
    </linearGradient>
    <linearGradient id="future" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5B8FF9"/>
      <stop offset="1" stop-color="#7A5AF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#344054" flood-opacity=".11"/>
    </filter>
    <style>
      .cn{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:43px;font-weight:700;fill:#101828}
      .sub{font-size:22px;fill:#667085}
      .era{font-size:18px;font-weight:700}
      .head{font-size:24px;font-weight:700;fill:#101828}
      .body{font-size:18px;fill:#667085}
      .small{font-size:16px;fill:#667085}
      .artifact{font-size:19px;font-weight:700}
    </style>
  </defs>

  <rect width="1400" height="788" rx="32" fill="url(#bg)"/>
  <text class="cn title" x="72" y="81">交付物跟着责任与验证边界移动</text>
  <text class="cn sub" x="72" y="122">减少 handoff 不等于减少 evidence，而是把验收逐步编码进开发系统</text>

  <g filter="url(#shadow)">
    <rect x="62" y="184" width="388" height="438" rx="28" fill="#FFFFFF"/>
    <rect x="506" y="184" width="388" height="438" rx="28" fill="#FFFFFF"/>
    <rect x="950" y="184" width="388" height="438" rx="28" fill="url(#future)"/>
  </g>

  <rect x="92" y="214" width="112" height="34" rx="17" fill="#F2F4F7"/>
  <text class="cn era" x="148" y="237" text-anchor="middle" fill="#344054">传统协作</text>
  <text class="cn head" x="92" y="297">角色之间的边界</text>

  <rect x="92" y="332" width="130" height="66" rx="18" fill="#EEF4FF"/>
  <text class="cn body" x="157" y="371" text-anchor="middle">产品</text>
  <path d="M234 365H278" fill="none" stroke="#98A2B3" stroke-width="5" stroke-linecap="round"/>
  <path d="M264 353L279 365L264 377" fill="none" stroke="#98A2B3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="292" y="332" width="128" height="66" rx="18" fill="#F2F4F7"/>
  <text class="cn body" x="356" y="371" text-anchor="middle">开发</text>

  <text class="cn small" x="92" y="447">最昂贵：沟通 + 人工实现</text>
  <rect x="92" y="481" width="328" height="96" rx="20" fill="#F8FAFC" stroke="#D0D5DD" stroke-width="2"/>
  <text class="cn small" x="116" y="514">关键交付物</text>
  <text class="cn artifact" x="116" y="550" fill="#344054">需求单 · 技术方案 · 代码</text>

  <rect x="536" y="214" width="112" height="34" rx="17" fill="#F4F0FF"/>
  <text class="cn era" x="592" y="237" text-anchor="middle" fill="#6941C6">DevOps / CD</text>
  <text class="cn head" x="536" y="297">价值流内的门禁</text>

  <rect x="536" y="332" width="130" height="66" rx="18" fill="#F4F0FF"/>
  <text class="cn body" x="601" y="371" text-anchor="middle">同一团队</text>
  <path d="M678 365H722" fill="none" stroke="#7A5AF8" stroke-width="5" stroke-linecap="round"/>
  <path d="M708 353L723 365L708 377" fill="none" stroke="#7A5AF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="736" y="332" width="128" height="66" rx="18" fill="#EEF4FF"/>
  <text class="cn body" x="800" y="371" text-anchor="middle">线上</text>

  <text class="cn small" x="536" y="447">关键能力：验证变化 + 快速反馈</text>
  <rect x="536" y="481" width="328" height="96" rx="20" fill="#F9F5FF" stroke="#B9A7F8" stroke-width="2"/>
  <text class="cn small" x="560" y="514">关键交付物</text>
  <text class="cn artifact" x="560" y="550" fill="#6941C6">Release state · CI evidence</text>

  <rect x="980" y="214" width="112" height="34" rx="17" fill="#FFFFFF" fill-opacity=".16"/>
  <text class="cn era" x="1036" y="237" text-anchor="middle" fill="#FFFFFF">Agent-first</text>
  <text class="cn head" x="980" y="297" fill="#FFFFFF">变化与用户之间</text>

  <rect x="980" y="332" width="130" height="66" rx="18" fill="#FFFFFF" fill-opacity=".16"/>
  <text class="cn body" x="1045" y="371" text-anchor="middle" fill="#FFFFFF">Agent change</text>
  <path d="M1122 365H1166" fill="none" stroke="#D6BBFB" stroke-width="5" stroke-linecap="round"/>
  <path d="M1152 353L1167 365L1152 377" fill="none" stroke="#D6BBFB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1180" y="332" width="128" height="66" rx="18" fill="#F8FAFC"/>
  <text class="cn body" x="1244" y="371" text-anchor="middle" fill="#344054">真实用户</text>

  <rect x="980" y="420" width="328" height="44" rx="16" fill="#FFFFFF" fill-opacity=".18"/>
  <text class="cn small" x="1004" y="447" fill="#FFFFFF">开放问题：把判断编码为控制回路</text>
  <rect x="980" y="481" width="328" height="96" rx="20" fill="#F8FAFC" stroke="#D6BBFB" stroke-width="2"/>
  <text class="cn small" x="1004" y="514" fill="#6941C6">关键交付物</text>
  <text class="cn artifact" x="1004" y="550" fill="#344054">Evidence-carrying change</text>

  <path d="M450 403H490" fill="none" stroke="#98A2B3" stroke-width="6" stroke-linecap="round"/>
  <path d="M476 389L492 403L476 417" fill="none" stroke="#98A2B3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M894 403H934" fill="none" stroke="#98A2B3" stroke-width="6" stroke-linecap="round"/>
  <path d="M920 389L936 403L920 417" fill="none" stroke="#98A2B3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="244" y="672" width="912" height="62" rx="31" fill="#EEF4FF" stroke="#B2CCFF" stroke-width="2"/>
  <text class="cn" x="700" y="711" text-anchor="middle" font-size="21" font-weight="700" fill="#175CD3">AI 放大上游吞吐  →  平台、反馈与控制能力决定系统结果</text>
</svg>
