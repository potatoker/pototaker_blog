<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Spec 主流程与真实 Vibe Coding 闭环</title>
  <desc id="desc">上半部分展示想法先更新 spec、AI 读取 spec 再生成实现的理想流程；下半部分展示想法、AI 尝试、体验效果、继续修改的真实闭环，文档落在闭环之外并逐渐过期。</desc>
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#F9F5FF"/></linearGradient>
    <filter id="shadow12" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#344054" flood-opacity=".09"/></filter>
    <style>.cn{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:42px;font-weight:700;fill:#101828}.sub{font-size:21px;fill:#667085}.lane{font-size:18px;font-weight:700}.head{font-size:21px;font-weight:700;fill:#101828}.body{font-size:17px;fill:#667085}</style>
  </defs>
  <rect width="1400" height="760" rx="32" fill="url(#bg12)"/>
  <text class="cn title" x="72" y="78">同一份 spec，能否接住每一次想法？</text>
  <text class="cn sub" x="72" y="116">理想流程要求文档进入主链；真实 Vibe Coding 往往只围绕效果反馈</text>

  <rect x="60" y="158" width="1280" height="220" rx="28" fill="#FFFFFF" filter="url(#shadow12)"/>
  <rect x="88" y="184" width="130" height="34" rx="17" fill="#F4F0FF"/><text class="cn lane" x="153" y="207" text-anchor="middle" fill="#6941C6">SPEC 主流程</text>
  <g>
    <rect x="126" y="252" width="220" height="82" rx="22" fill="#F2F4F7"/><text class="cn head" x="236" y="302" text-anchor="middle">人的新想法</text>
    <rect x="406" y="240" width="220" height="106" rx="22" fill="#F4F0FF" stroke="#B9A7F8" stroke-width="2"/><text class="cn body" x="516" y="271" text-anchor="middle" fill="#6941C6">唯一上下文</text><text class="cn head" x="516" y="310" text-anchor="middle">更新同一份 spec</text>
    <rect x="686" y="252" width="220" height="82" rx="22" fill="#EEF4FF"/><text class="cn head" x="796" y="302" text-anchor="middle">AI 读取 spec</text>
    <rect x="966" y="252" width="260" height="82" rx="22" fill="#ECFDF3" stroke="#6CE9A6" stroke-width="2"/><text class="cn head" x="1096" y="302" text-anchor="middle" fill="#027A48">生成或修改实现</text>
  </g>
  <g fill="none" stroke="#7A5AF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M356 293H390"/><path d="M378 282L391 293L378 304"/>
    <path d="M636 293H670"/><path d="M658 282L671 293L658 304"/>
    <path d="M916 293H950"/><path d="M938 282L951 293L938 304"/>
  </g>

  <rect x="60" y="414" width="1280" height="278" rx="28" fill="#FFFFFF" filter="url(#shadow12)"/>
  <rect x="88" y="440" width="150" height="34" rx="17" fill="#FFF7ED"/><text class="cn lane" x="163" y="463" text-anchor="middle" fill="#B54708">真实 VIBE 闭环</text>
  <rect x="120" y="520" width="190" height="76" rx="20" fill="#FFF7ED"/><text class="cn head" x="215" y="566" text-anchor="middle">想到一点</text>
  <rect x="370" y="520" width="190" height="76" rx="20" fill="#FFF7ED"/><text class="cn head" x="465" y="566" text-anchor="middle">让 AI 先试</text>
  <rect x="620" y="520" width="190" height="76" rx="20" fill="#ECFDF3"/><text class="cn head" x="715" y="566" text-anchor="middle">看实际效果</text>
  <rect x="870" y="520" width="190" height="76" rx="20" fill="#FFF7ED"/><text class="cn head" x="965" y="555" text-anchor="middle">继续调整</text><text class="cn body" x="965" y="582" text-anchor="middle">马上进入下一轮</text>
  <g fill="none" stroke="#F79009" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M320 558H354"/><path d="M342 547L355 558L342 569"/>
    <path d="M570 558H604"/><path d="M592 547L605 558L592 569"/>
    <path d="M820 558H854"/><path d="M842 547L855 558L842 569"/>
    <path d="M965 610C965 654 215 654 215 610"/><path d="M202 623L215 609L228 623"/>
  </g>
  <rect x="1110" y="496" width="180" height="124" rx="20" fill="#F2F4F7" stroke="#D0D5DD" stroke-width="2" stroke-dasharray="8 8"/>
  <text class="cn head" x="1200" y="542" text-anchor="middle" fill="#475467">文档</text><text class="cn body" x="1200" y="574" text-anchor="middle">不参与下一轮</text><text class="cn body" x="1200" y="600" text-anchor="middle" fill="#B42318">最终 rot</text>
  <path d="M1068 558H1094" stroke="#98A2B3" stroke-width="3" stroke-dasharray="7 7"/>
  <text class="cn body" x="700" y="671" text-anchor="middle" fill="#B54708">没有进入反馈闭环的东西，就不会跟着下一轮一起演化</text>
</svg>
