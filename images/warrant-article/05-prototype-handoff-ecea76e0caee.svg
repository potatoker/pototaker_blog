<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">原型项目到生产的交接链路</title>
  <desc id="desc">原型项目从代码生成 manifest、golden corpus 和 deploy packet，生产团队实现后提交证据，由 parity gate 计算是否一致。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EFF8FF"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EEF4FF"/><stop offset="1" stop-color="#E0EAFF"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ECFDF3"/><stop offset="1" stop-color="#D1FADF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#344054" flood-opacity=".11"/></filter>
    <style>
      .cn{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:43px;font-weight:700;fill:#101828}.sub{font-size:22px;fill:#667085}
      .head{font-size:27px;font-weight:700;fill:#101828}.body{font-size:19px;fill:#475467}.tag{font-size:17px;font-weight:700}
    </style>
  </defs>
  <rect width="1400" height="788" rx="32" fill="url(#bg)"/>
  <text class="cn title" x="72" y="81">原型项目的交付物，最后变成了一条可计算的链</text>
  <text class="cn sub" x="72" y="122">部署侧不复制 Python 文件；它复现正式行为，再用同一组证据验收</text>

  <rect x="66" y="181" width="292" height="474" rx="30" fill="url(#left)" stroke="#84ADFF" stroke-width="2"/>
  <text class="cn" x="106" y="229" font-size="18" font-weight="700" fill="#175CD3">DEMO SIDE</text>
  <text class="cn head" x="106" y="274">原型项目</text>
  <rect x="106" y="315" width="212" height="71" rx="18" fill="#FFFFFF"/><text class="cn body" x="132" y="357">正式代码路径</text>
  <rect x="106" y="407" width="212" height="71" rx="18" fill="#FFFFFF"/><text class="cn body" x="132" y="449">prompt / 配置</text>
  <rect x="106" y="499" width="212" height="71" rx="18" fill="#FFFFFF"/><text class="cn body" x="132" y="541">routing / handoff</text>
  <rect x="106" y="591" width="212" height="40" rx="20" fill="#175CD3"/><text class="cn tag" x="212" y="617" text-anchor="middle" fill="#FFFFFF">REFERENCE</text>

  <g filter="url(#shadow)">
    <rect x="430" y="177" width="460" height="482" rx="30" fill="#FFFFFF"/>
  </g>
  <text class="cn" x="470" y="229" font-size="18" font-weight="700" fill="#6941C6">PRODUCTION ARTIFACTS</text>
  <text class="cn head" x="470" y="274">可交付的中间层</text>
  <rect x="470" y="313" width="380" height="82" rx="20" fill="#F4F0FF"/>
  <text class="cn head" x="500" y="348" font-size="22">Manifest</text><text class="cn body" x="500" y="378">本版完整技术范围 + content_hash</text>
  <rect x="470" y="415" width="380" height="82" rx="20" fill="#EFF8FF"/>
  <text class="cn head" x="500" y="450" font-size="22">Golden corpus</text><text class="cn body" x="500" y="480">路由、handoff、边界行为用例</text>
  <rect x="470" y="517" width="380" height="82" rx="20" fill="#FFF7ED"/>
  <text class="cn head" x="500" y="552" font-size="22">Deploy packet</text><text class="cn body" x="500" y="582">相对上一版，这次究竟改了什么</text>
  <path d="M376 418H407" stroke="#7A5AF8" stroke-width="7" stroke-linecap="round"/><path d="M394 402L410 418L394 434" fill="none" stroke="#7A5AF8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="962" y="181" width="372" height="474" rx="30" fill="url(#right)" stroke="#6CE9A6" stroke-width="2"/>
  <text class="cn" x="1002" y="229" font-size="18" font-weight="700" fill="#027A48">PRODUCTION SIDE</text>
  <text class="cn head" x="1002" y="274">生产团队 + AI</text>
  <rect x="1002" y="315" width="292" height="82" rx="20" fill="#FFFFFF"/>
  <text class="cn body" x="1032" y="349">按规范实现</text><text class="cn body" x="1032" y="378">不要求语言与目录相同</text>
  <rect x="1002" y="417" width="292" height="82" rx="20" fill="#FFFFFF"/>
  <text class="cn body" x="1032" y="451">运行同一组 golden</text><text class="cn body" x="1032" y="480">返回逐 case 证据</text>
  <rect x="1002" y="519" width="292" height="82" rx="20" fill="#101828"/>
  <text class="cn" x="1032" y="553" font-size="21" font-weight="700" fill="#FFFFFF">Parity Gate</text>
  <text class="cn" x="1032" y="582" font-size="18" fill="#D0D5DD">程序重新计算 PASS / FAIL</text>
  <path d="M908 418H939" stroke="#12B76A" stroke-width="7" stroke-linecap="round"/><path d="M926 402L942 418L926 434" fill="none" stroke="#12B76A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M1148 672C1148 725 660 730 660 674" fill="none" stroke="#98A2B3" stroke-width="4" stroke-dasharray="10 10"/>
  <path d="M644 689L660 672L676 689" fill="none" stroke="#98A2B3" stroke-width="4" stroke-linecap="round"/>
  <text class="cn" x="903" y="744" text-anchor="middle" font-size="19" fill="#667085">结果证据回到同一套验收规则</text>
</svg>
