<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">Vibe Coding 跑通之后，上下文消失了</title>
  <desc id="desc">人与 AI 的零散对话产生可运行代码，但对话上下文消失后，下一个人和 AI 都需要重新猜测代码意图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#F6F3FF"/>
    </linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8FF9"/>
      <stop offset="1" stop-color="#7A5AF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#344054" flood-opacity=".12"/>
    </filter>
    <style>
      .cn{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:44px;font-weight:700;fill:#101828}
      .subtitle{font-size:23px;fill:#667085}
      .card-title{font-size:27px;font-weight:700;fill:#101828}
      .body{font-size:21px;fill:#475467}
      .small{font-size:18px;fill:#667085}
    </style>
  </defs>
  <rect width="1400" height="788" rx="32" fill="url(#bg)"/>
  <text class="cn title" x="74" y="82">Vibe Coding 最尴尬的一刻</text>
  <text class="cn subtitle" x="74" y="123">功能已经跑通，但下一位接手者问：它为什么是这样？</text>

  <g filter="url(#shadow)">
    <rect x="74" y="190" width="330" height="390" rx="28" fill="#FFFFFF"/>
    <rect x="535" y="190" width="330" height="390" rx="28" fill="url(#code)"/>
    <rect x="996" y="190" width="330" height="390" rx="28" fill="#FFFFFF"/>
  </g>

  <circle cx="130" cy="247" r="29" fill="#E9F0FF"/>
  <text class="cn" x="130" y="256" text-anchor="middle" font-size="25">💬</text>
  <text class="cn card-title" x="178" y="255">反复对话</text>
  <rect x="112" y="304" width="236" height="58" rx="18" fill="#F2F4F7"/>
  <text class="cn body" x="132" y="340">“这个路由再改一下”</text>
  <rect x="144" y="380" width="204" height="58" rx="18" fill="#EEF4FF"/>
  <text class="cn body" x="164" y="416">“这版效果对了”</text>
  <rect x="112" y="456" width="223" height="58" rx="18" fill="#F2F4F7"/>
  <text class="cn body" x="132" y="492">“上游再补个字段”</text>

  <circle cx="591" cy="247" r="29" fill="#FFFFFF" fill-opacity=".18"/>
  <text class="cn" x="591" y="256" text-anchor="middle" font-size="25">✓</text>
  <text class="cn card-title" x="639" y="255" fill="#FFFFFF">代码跑通</text>
  <rect x="576" y="309" width="248" height="196" rx="18" fill="#111827" fill-opacity=".82"/>
  <text x="604" y="353" font-family="monospace" font-size="19" fill="#93C5FD">route(input)</text>
  <text x="604" y="392" font-family="monospace" font-size="19" fill="#C4B5FD">→ refine()</text>
  <text x="604" y="431" font-family="monospace" font-size="19" fill="#6EE7B7">→ compose()</text>
  <text x="604" y="470" font-family="monospace" font-size="19" fill="#FDE68A">→ render()</text>
  <rect x="574" y="518" width="252" height="46" rx="23" fill="#101828" fill-opacity=".58"/>
  <text class="cn" x="700" y="548" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">唯一留下来的“事实”</text>

  <circle cx="1052" cy="247" r="29" fill="#FFF4E5"/>
  <text class="cn" x="1052" y="256" text-anchor="middle" font-size="25">？</text>
  <text class="cn card-title" x="1100" y="255">重新猜</text>
  <text class="cn body" x="1040" y="329">哪条路径是正式的？</text>
  <text class="cn body" x="1040" y="384">这个默认值能改吗？</text>
  <text class="cn body" x="1040" y="439">旧文件还要实现吗？</text>
  <text class="cn body" x="1040" y="494">怎样才算同步正确？</text>

  <path d="M420 385H509" stroke="#98A2B3" stroke-width="8" stroke-linecap="round"/>
  <path d="M491 367L512 385L491 403" fill="none" stroke="#98A2B3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M881 385H926" stroke="#D0D5DD" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 14"/>
  <path d="M954 385H980" stroke="#D0D5DD" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 14"/>
  <circle cx="941" cy="385" r="36" fill="#FFF1F3" stroke="#FDA4AF" stroke-width="3"/>
  <path d="M925 369L957 401M957 369L925 401" stroke="#E11D48" stroke-width="7" stroke-linecap="round"/>

  <rect x="316" y="641" width="768" height="83" rx="42" fill="#101828"/>
  <text class="cn" x="700" y="693" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">代码留下来了，做出这些代码的“事实需求单”却没有</text>
</svg>
