<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">带证据的变化</title>
  <desc id="desc">变化生产者不只交付代码，还交付行为范围、约束、验收证据、来源版本和回退条件；接收方使用独立 gate 验证后，变化才能进入真实用户环境。</desc>
  <defs>
    <linearGradient id="bg18" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#F9F5FF"/></linearGradient>
    <linearGradient id="change18" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5B8FF9"/><stop offset="1" stop-color="#7A5AF8"/></linearGradient>
    <filter id="shadow18" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#344054" flood-opacity=".1"/></filter>
    <style>.cn{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:42px;font-weight:700;fill:#101828}.sub{font-size:21px;fill:#667085}.head{font-size:22px;font-weight:700;fill:#101828}.body{font-size:17px;fill:#667085}.tag{font-size:16px;font-weight:700}</style>
  </defs>
  <rect width="1400" height="760" rx="32" fill="url(#bg18)"/>
  <text class="cn title" x="72" y="78">下一代交付单位，可能是一项“带证据的变化”</text>
  <text class="cn sub" x="72" y="116">生产者不只交付结果，还要交付接收方可以独立检查的依据</text>
  <rect x="62" y="196" width="250" height="362" rx="28" fill="#FFFFFF" filter="url(#shadow18)"/>
  <rect x="92" y="226" width="112" height="34" rx="17" fill="#FFF7ED"/><text class="cn tag" x="148" y="249" text-anchor="middle" fill="#B54708">PRODUCER</text>
  <text class="cn head" x="92" y="308">人 + Agent</text><text class="cn body" x="92" y="350">提出并实现变化</text>
  <rect x="92" y="392" width="190" height="72" rx="20" fill="#FFF7ED"/><text class="cn body" x="187" y="422" text-anchor="middle">“我已经完成”</text><text class="cn body" x="187" y="449" text-anchor="middle" fill="#B42318">不是生产证据</text>

  <rect x="398" y="166" width="604" height="422" rx="32" fill="url(#change18)" filter="url(#shadow18)"/>
  <text class="cn tag" x="700" y="212" text-anchor="middle" fill="#E9D7FE">EVIDENCE-CARRYING CHANGE</text>
  <rect x="464" y="225" width="472" height="54" rx="27" fill="#FFFFFF" fill-opacity=".16"/>
  <text class="cn" x="700" y="262" text-anchor="middle" font-size="34" font-weight="800" fill="#FFFFFF">一次变化携带的最小上下文</text>
  <rect x="442" y="300" width="240" height="72" rx="19" fill="#F8FAFC"/><text class="cn body" x="562" y="343" text-anchor="middle" fill="#344054">行为目标与正式范围</text>
  <rect x="718" y="300" width="240" height="72" rx="19" fill="#F8FAFC"/><text class="cn body" x="838" y="343" text-anchor="middle" fill="#344054">实际代码与配置</text>
  <rect x="442" y="396" width="240" height="72" rx="19" fill="#F8FAFC"/><text class="cn body" x="562" y="439" text-anchor="middle" fill="#344054">不变量与验收 evidence</text>
  <rect x="718" y="396" width="240" height="72" rx="19" fill="#F8FAFC"/><text class="cn body" x="838" y="439" text-anchor="middle" fill="#344054">来源、环境与版本</text>
  <rect x="514" y="500" width="372" height="52" rx="20" fill="#F8FAFC" stroke="#B2CCFF" stroke-width="2"/><text class="cn body" x="700" y="532" text-anchor="middle" fill="#344054">线上观测与回退条件</text>

  <rect x="1088" y="196" width="250" height="362" rx="28" fill="#FFFFFF" filter="url(#shadow18)"/>
  <rect x="1118" y="226" width="106" height="34" rx="17" fill="#ECFDF3"/><text class="cn tag" x="1171" y="249" text-anchor="middle" fill="#027A48">RECEIVER</text>
  <text class="cn head" x="1118" y="308">独立 Gate</text><text class="cn body" x="1118" y="350">验证来源、约束与证据</text>
  <rect x="1118" y="392" width="190" height="72" rx="20" fill="#ECFDF3"/><text class="cn head" x="1213" y="422" text-anchor="middle" fill="#027A48">获得生产资格</text><text class="cn body" x="1213" y="449" text-anchor="middle">进入真实用户环境</text>
  <g stroke="#7A5AF8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M328 377H378"/><path d="M364 363L380 377L364 391"/><path d="M1022 377H1072"/><path d="M1058 363L1074 377L1058 391"/></g>
  <rect x="240" y="646" width="920" height="64" rx="32" fill="#EEF4FF" stroke="#B2CCFF" stroke-width="2"/>
  <text class="cn" x="700" y="686" text-anchor="middle" font-size="20" font-weight="700" fill="#175CD3">结果可以由 AI 生成，信任必须由结果之外的证据建立</text>
</svg>
