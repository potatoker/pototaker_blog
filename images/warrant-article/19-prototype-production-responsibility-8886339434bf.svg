<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">原型到线上的新开发责任链路</title>
  <desc id="desc">原型侧通过快速试验找到成立的产品效果，再通过一次仍留有问号的交付，由线上侧完成生产实现。</desc>
  <defs>
    <linearGradient id="bg19" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F9F5FF"/>
    </linearGradient>
    <linearGradient id="handoff19" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EEF4FF"/>
      <stop offset="1" stop-color="#F4F0FF"/>
    </linearGradient>
    <filter id="shadow19" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#344054" flood-opacity=".10"/>
    </filter>
    <style>
      .cn{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:42px;font-weight:700;fill:#101828}
      .sub{font-size:21px;fill:#667085}
      .tag{font-size:15px;font-weight:700}
      .head{font-size:27px;font-weight:700;fill:#101828}
      .label{font-size:16px;font-weight:700}
      .body{font-size:18px;fill:#475467}
      .small{font-size:16px;fill:#667085}
    </style>
  </defs>

  <rect width="1400" height="700" rx="32" fill="url(#bg19)"/>
  <text class="cn title" x="72" y="78">原型 → 线上：一条新的开发责任链路</text>
  <text class="cn sub" x="72" y="116">原型侧先把效果试出来，再由线上侧让它成为可以长期运行的正式实现</text>

  <g filter="url(#shadow19)">
    <rect x="62" y="168" width="440" height="430" rx="30" fill="#FFFFFF"/>
    <rect x="898" y="168" width="440" height="430" rx="30" fill="#FFFFFF"/>
  </g>

  <rect x="94" y="198" width="122" height="34" rx="17" fill="#FFF7ED"/>
  <text class="cn tag" x="155" y="221" text-anchor="middle" fill="#B54708">PROTOTYPE</text>
  <text class="cn head" x="94" y="276">原型责任域</text>
  <text class="cn label" x="94" y="322" fill="#B54708">目标</text>
  <text class="cn body" x="164" y="322">把产品想法变成可体验的真实效果</text>
  <line x1="94" y1="348" x2="470" y2="348" stroke="#EAECF0" stroke-width="2"/>

  <text class="cn label" x="94" y="389" fill="#B54708">工作</text>
  <text class="cn body" x="164" y="389">人与 AI 快速尝试、运行、体验与调整</text>
  <text class="cn label" x="94" y="438" fill="#B54708">验收</text>
  <text class="cn body" x="164" y="438">负责人亲自确认“这一版效果成立”</text>
  <rect x="94" y="486" width="376" height="78" rx="20" fill="#FFF7ED" stroke="#FEDF89" stroke-width="2"/>
  <text class="cn small" x="118" y="517">原型结果</text>
  <text class="cn body" x="118" y="545">已经由负责人亲自确认的效果</text>

  <rect x="590" y="330" width="220" height="104" rx="28" fill="url(#handoff19)" stroke="#B9A7F8" stroke-width="2"/>
  <text class="cn tag" x="700" y="365" text-anchor="middle" fill="#6941C6">HANDOFF</text>
  <text class="cn" x="700" y="408" text-anchor="middle" font-size="27" font-weight="700" fill="#101828">交付 <tspan fill="#6941C6">?</tspan></text>

  <path d="M514 382H576" stroke="#7A5AF8" stroke-width="6" stroke-linecap="round"/>
  <path d="M564 368L580 382L564 396" fill="none" stroke="#7A5AF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M824 382H886" stroke="#7A5AF8" stroke-width="6" stroke-linecap="round"/>
  <path d="M874 368L890 382L874 396" fill="none" stroke="#7A5AF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="930" y="198" width="122" height="34" rx="17" fill="#EEF4FF"/>
  <text class="cn tag" x="991" y="221" text-anchor="middle" fill="#175CD3">PRODUCTION</text>
  <text class="cn head" x="930" y="276">线上责任域</text>
  <text class="cn label" x="930" y="322" fill="#175CD3">目标</text>
  <text class="cn body" x="1000" y="322">让同样效果成为可长期运行的实现</text>
  <line x1="930" y1="348" x2="1306" y2="348" stroke="#EAECF0" stroke-width="2"/>

  <text class="cn label" x="930" y="389" fill="#175CD3">工作</text>
  <text class="cn body" x="1000" y="389">接入安全、监控、降级与生产环境</text>
  <text class="cn label" x="930" y="438" fill="#175CD3">验收</text>
  <text class="cn body" x="1000" y="438">用独立 gate 证明正式行为已经还原</text>
  <rect x="930" y="486" width="376" height="78" rx="20" fill="#EEF4FF" stroke="#B2CCFF" stroke-width="2"/>
  <text class="cn small" x="954" y="517">线上目标</text>
  <text class="cn body" x="954" y="545">能够稳定、安全地服务真实用户</text>

  <rect x="300" y="626" width="800" height="46" rx="23" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
  <text class="cn" x="700" y="656" text-anchor="middle" font-size="18" font-weight="700" fill="#475467">责任域不是组织边界：可以是不同团队，也可以是同一个人或同一组 AI</text>
</svg>
