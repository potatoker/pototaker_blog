<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Warrant 工具仓库与原型、生产宿主仓库的关系</title>
  <desc id="desc">Warrant 工具仓库独立提供 skills 和 CLI。原型宿主运行 onboard 与 release，保存 artifact 和 release bundle；bundle 携带原型仓库地址、主干和精确 commit。生产宿主先检出并验证只读参考源码，再执行 audit 或 sync，产出运行证据和 parity report。</desc>
  <defs>
    <linearGradient id="bg17" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F7F5FF"/>
    </linearGradient>
    <filter id="shadow17" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#344054" flood-opacity=".09"/>
    </filter>
    <marker id="arrow17" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1L10 6L1 11" fill="none" stroke="#667085" stroke-width="2"/>
    </marker>
    <style>
      .cn{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:40px;font-weight:700;fill:#101828}
      .sub{font-size:20px;fill:#667085}
      .tag{font-size:14px;font-weight:700;letter-spacing:1px}
      .head{font-size:22px;font-weight:700;fill:#101828}
      .body{font-size:16px;fill:#475467}
      .small{font-size:14px;fill:#667085}
    </style>
  </defs>

  <rect width="1400" height="780" rx="32" fill="url(#bg17)"/>
  <text class="cn title" x="70" y="72">Warrant 工具独立，交付发生在两个宿主仓库之间</text>
  <text class="cn sub" x="70" y="110">bundle 交付行为契约；release manifest 定位不可变的原型参考源码</text>

  <g filter="url(#shadow17)">
    <rect x="474" y="145" width="452" height="124" rx="26" fill="#FFFFFF"/>
  </g>
  <rect x="500" y="169" width="128" height="30" rx="15" fill="#F4F0FF"/>
  <text class="cn tag" x="564" y="189" text-anchor="middle" fill="#6941C6">WARRANT REPO</text>
  <text class="cn head" x="500" y="232">独立安装的工具仓库</text>
  <rect x="742" y="174" width="76" height="36" rx="18" fill="#EEF4FF"/>
  <text class="cn small" x="780" y="197" text-anchor="middle" fill="#175CD3">skills</text>
  <rect x="828" y="174" width="72" height="36" rx="18" fill="#ECFDF3"/>
  <text class="cn small" x="864" y="197" text-anchor="middle" fill="#027A48">CLI</text>
  <text class="cn small" x="742" y="232">提供方法和门禁，不保存业务 artifact</text>

  <g filter="url(#shadow17)">
    <rect x="70" y="338" width="520" height="330" rx="30" fill="#FFFFFF"/>
    <rect x="810" y="338" width="520" height="330" rx="30" fill="#FFFFFF"/>
  </g>

  <rect x="98" y="366" width="132" height="30" rx="15" fill="#EEF4FF"/>
  <text class="cn tag" x="164" y="386" text-anchor="middle" fill="#175CD3">PROTOTYPE HOST</text>
  <text class="cn head" x="98" y="435">原型宿主仓库 + 原型侧 Agent</text>
  <text class="cn body" x="98" y="470">onboard：从正式入口恢复设计与行为契约</text>
  <text class="cn body" x="98" y="500">release：门禁通过后导出不可变 bundle</text>

  <rect x="98" y="530" width="218" height="102" rx="18" fill="#F8FAFC"/>
  <text class="cn head" x="120" y="562" font-size="18">.warrant/</text>
  <text class="cn small" x="120" y="590">config · artifact · corpus</text>
  <text class="cn small" x="120" y="613">decisions · confirmations</text>

  <rect x="338" y="530" width="224" height="102" rx="18" fill="#EEF4FF"/>
  <text class="cn head" x="360" y="562" font-size="18">releases/&lt;hash&gt;/</text>
  <text class="cn small" x="360" y="590">bundle + content_hash</text>
  <text class="cn small" x="360" y="613">repository · mainline · commit</text>

  <rect x="838" y="366" width="140" height="30" rx="15" fill="#ECFDF3"/>
  <text class="cn tag" x="908" y="386" text-anchor="middle" fill="#027A48">PRODUCTION HOST</text>
  <text class="cn head" x="838" y="435">生产宿主仓库 + 部署侧 Agent</text>
  <text class="cn body" x="838" y="470">audit：首次全量对照行为、配置与数据交接</text>
  <text class="cn body" x="838" y="500">sync：读取契约 diff 与原型 commit 区间</text>

  <rect x="838" y="530" width="218" height="102" rx="18" fill="#F8FAFC"/>
  <text class="cn head" x="860" y="562" font-size="18">只读原型 checkout</text>
  <text class="cn small" x="860" y="590">checkout 精确 commit</text>
  <text class="cn small" x="860" y="613">verify-source 校验来源</text>

  <rect x="1078" y="530" width="224" height="102" rx="18" fill="#ECFDF3"/>
  <text class="cn head" x="1100" y="562" font-size="18">生产验收结果</text>
  <text class="cn small" x="1100" y="590">运行 evidence</text>
  <text class="cn small" x="1100" y="613">parity-report · blockers</text>

  <path d="M560 269V306H330V328" fill="none" stroke="#98A2B3" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow17)"/>
  <path d="M840 269V306H1070V328" fill="none" stroke="#98A2B3" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow17)"/>
  <text class="cn small" x="366" y="298" text-anchor="middle">安装 skills + CLI</text>
  <text class="cn small" x="1034" y="298" text-anchor="middle">安装 skills + CLI</text>

  <path d="M590 470H782" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow17)"/>
  <text class="cn small" x="700" y="447" text-anchor="middle">bundle + source identity</text>
  <text class="cn small" x="700" y="471" text-anchor="middle">audit / sync</text>

  <rect x="322" y="708" width="756" height="42" rx="21" fill="#EEF4FF"/>
  <text class="cn body" x="700" y="735" text-anchor="middle" fill="#175CD3">content_hash 标识契约 · Git commit 标识参考源码 · 两者共同构成可复核交付</text>
</svg>
